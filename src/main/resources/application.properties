spring.application.name=flowops-backend
spring.datasource.url=${FLOWOPS_DB_URL:jdbc:postgresql://localhost:5432/flowops}
spring.datasource.username=${FLOWOPS_DB_USERNAME:postgres}
spring.datasource.password=${FLOWOPS_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${FLOWOPS_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.mail.host=${FLOWOPS_MAIL_HOST:localhost}
spring.mail.port=${FLOWOPS_MAIL_PORT:1025}
spring.mail.username=${FLOWOPS_MAIL_USERNAME:}
spring.mail.password=${FLOWOPS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${FLOWOPS_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${FLOWOPS_MAIL_STARTTLS:false}
springdoc.swagger-ui.path=/swagger-ui.html
flowops.security.jwt.secret=${FLOWOPS_JWT_SECRET:flowops-local-development-secret-key-32}
flowops.security.jwt.expiration=${FLOWOPS_JWT_EXPIRATION:28800}
flowops.cors.allowed-origins=${FLOWOPS_CORS_ORIGINS:http://localhost:4200}
flowops.mail.enabled=${FLOWOPS_MAIL_ENABLED:false}
flowops.mail.from=${FLOWOPS_MAIL_FROM:noreply@flowops.local}
flowops.bootstrap.admin.enabled=${FLOWOPS_BOOTSTRAP_ADMIN_ENABLED:false}
flowops.bootstrap.admin.nome=${FLOWOPS_BOOTSTRAP_ADMIN_NOME:Administrador FlowOps}
flowops.bootstrap.admin.cpf=${FLOWOPS_BOOTSTRAP_ADMIN_CPF:00000000000}
flowops.bootstrap.admin.email=${FLOWOPS_BOOTSTRAP_ADMIN_EMAIL:admin@flowops.local}
flowops.bootstrap.admin.senha=${FLOWOPS_BOOTSTRAP_ADMIN_SENHA:ChangeMe123!}
