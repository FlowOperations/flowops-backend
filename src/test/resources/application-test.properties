spring.datasource.url=jdbc:h2:mem:flowops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
flowops.security.jwt.secret=flowops-test-secret-key-with-32-bytes
flowops.bootstrap.admin.enabled=false
